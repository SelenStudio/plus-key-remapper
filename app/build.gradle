plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pluskeymap.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.pluskeymap.app"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // androidx.media removed — it was pulled in for the old mediaPlayback FGS type
    // workaround (now replaced with specialUse). Google Play scanner flags it for
    // phone number access (telephony state for audio focus during calls), causing
    // Data Safety form rejection. No app code uses androidx.media APIs.
    // FIX: WorkManager for periodic keepalive — OxygenOS honours WorkManager
    // constraints better than raw AlarmManager for background apps.
    implementation 'androidx.work:work-runtime:2.9.1'
    // Shizuku — grants READ_LOGS without a PC after the one-time Shizuku ADB setup
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
